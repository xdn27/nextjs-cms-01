<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <!-- Dark Neon Showroom Canvas -->
  <rect width="1920" height="1080" fill="#0d0a1a"/>

  <defs>
    <radialGradient id="purple-spotlight" cx="60%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#6d28d9" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0d0a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink-spotlight" cx="80%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#be185d" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0d0a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon-cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Ambient Light Fields -->
  <rect width="1920" height="1080" fill="url(#purple-spotlight)"/>
  <rect width="1920" height="1080" fill="url(#pink-spotlight)"/>

  <!-- Showroom Podium Floor Reflection -->
  <g opacity="0.35">
    <ellipse cx="1350" cy="850" rx="480" ry="140" fill="#8b5cf6" fill-opacity="0.25" filter="blur(30px)"/>
    <ellipse cx="1400" cy="860" rx="360" ry="80" fill="#ec4899" fill-opacity="0.2" filter="blur(20px)"/>
  </g>

  <!-- Showroom Showcase: Floating High-End Graphics Card (Right Hero Focus) -->
  <g transform="translate(1080, 260)">
    <!-- GPU Main Body Shroud (Angled 3D Feel) -->
    <rect x="0" y="80" width="560" height="240" rx="20" fill="#181528" stroke="#382f5c" stroke-width="4"/>
    <rect x="15" y="95" width="530" height="210" rx="14" fill="#0f0c1b" stroke="#251f3d" stroke-width="2"/>

    <!-- Dual Triple Fans with Holographic Blades -->
    <!-- Fan 1 -->
    <circle cx="110" cy="200" r="70" stroke="#8b5cf6" stroke-width="4" fill="#181528" stroke-dasharray="24 10"/>
    <circle cx="110" cy="200" r="26" fill="#06b6d4"/>
    <circle cx="110" cy="200" r="14" fill="#ffffff" fill-opacity="0.8"/>

    <!-- Fan 2 -->
    <circle cx="280" cy="200" r="70" stroke="#ec4899" stroke-width="4" fill="#181528" stroke-dasharray="24 10"/>
    <circle cx="280" cy="200" r="26" fill="#8b5cf6"/>
    <circle cx="280" cy="200" r="14" fill="#ffffff" fill-opacity="0.8"/>

    <!-- Fan 3 -->
    <circle cx="450" cy="200" r="70" stroke="#06b6d4" stroke-width="4" fill="#181528" stroke-dasharray="24 10"/>
    <circle cx="450" cy="200" r="26" fill="#ec4899"/>
    <circle cx="450" cy="200" r="14" fill="#ffffff" fill-opacity="0.8"/>

    <!-- Top RGB Light Bar -->
    <rect x="50" y="105" width="460" height="12" rx="4" fill="url(#neon-cyan-purple)" filter="drop-shadow(0 0 10px #8b5cf6)"/>
    
    <!-- Branding Badge -->
    <rect x="220" y="130" width="120" height="24" rx="6" fill="#2e2354"/>
    <text x="235" y="147" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="900" letter-spacing="2">GEFORCE RTX</text>

    <!-- Metal Backplate Accent Lines -->
    <line x1="30" y1="285" x2="200" y2="285" stroke="#4c3d75" stroke-width="3" stroke-linecap="round"/>
    <line x1="220" y1="285" x2="530" y2="285" stroke="#4c3d75" stroke-width="3" stroke-linecap="round"/>

    <!-- Peripheral: Mechanical Gaming Keyboard Silhouette under GPU -->
    <g transform="translate(40, 360)">
      <rect x="0" y="0" width="500" height="140" rx="14" fill="#161224" stroke="#31264f" stroke-width="2"/>
      <!-- Keycap rows with subtle RGB backlight -->
      <g opacity="0.85">
        <!-- Row 1 -->
        <rect x="20" y="20" width="460" height="16" rx="4" fill="url(#neon-cyan-purple)" opacity="0.6"/>
        <!-- Row 2 -->
        <rect x="20" y="44" width="460" height="16" rx="4" fill="url(#neon-cyan-purple)" opacity="0.7"/>
        <!-- Row 3 -->
        <rect x="20" y="68" width="460" height="16" rx="4" fill="url(#neon-cyan-purple)" opacity="0.8"/>
        <!-- Spacebar Row -->
        <rect x="150" y="96" width="200" height="20" rx="5" fill="#8b5cf6" filter="drop-shadow(0 0 8px #8b5cf6)"/>
      </g>
    </g>
  </g>

  <!-- Left Futuristic Display Interface Motif -->
  <g opacity="0.3">
    <path d="M100 220 L240 220 L310 290 L520 290" stroke="#8b5cf6" stroke-width="3" fill="none"/>
    <circle cx="100" cy="220" r="6" fill="#8b5cf6"/>
    <circle cx="520" cy="290" r="6" fill="#8b5cf6"/>

    <path d="M140 380 L290 380 L370 460 L580 460" stroke="#ec4899" stroke-width="2.5" fill="none"/>
    <circle cx="140" cy="380" r="5" fill="#ec4899"/>
    <circle cx="580" cy="460" r="5" fill="#ec4899"/>
  </g>
</svg>
