<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <!-- Deep Dark Tech Canvas -->
  <rect width="1920" height="1080" fill="#090d16"/>
  
  <defs>
    <radialGradient id="cyan-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3584e4" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#1c71d8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purple-glow" cx="75%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#7c3aed" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyber-grid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3584e4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3584e4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3584e4" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="rgb-fan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Ambient Light Fields -->
  <rect width="1920" height="1080" fill="url(#cyan-glow)"/>
  <rect width="1920" height="1080" fill="url(#purple-glow)"/>

  <!-- Perspective Floor Grid -->
  <g opacity="0.4">
    <line x1="0" y1="800" x2="1920" y2="800" stroke="#3584e4" stroke-opacity="0.15" stroke-width="1.5"/>
    <line x1="0" y1="870" x2="1920" y2="870" stroke="#3584e4" stroke-opacity="0.2" stroke-width="1.5"/>
    <line x1="0" y1="950" x2="1920" y2="950" stroke="#3584e4" stroke-opacity="0.25" stroke-width="2"/>
    <line x1="0" y1="1040" x2="1920" y2="1040" stroke="#3584e4" stroke-opacity="0.3" stroke-width="2"/>

    <!-- Perspective Rays -->
    <line x1="960" y1="700" x2="100" y2="1080" stroke="#3584e4" stroke-opacity="0.2"/>
    <line x1="960" y1="700" x2="450" y2="1080" stroke="#3584e4" stroke-opacity="0.2"/>
    <line x1="960" y1="700" x2="800" y2="1080" stroke="#3584e4" stroke-opacity="0.2"/>
    <line x1="960" y1="700" x2="1120" y2="1080" stroke="#3584e4" stroke-opacity="0.2"/>
    <line x1="960" y1="700" x2="1470" y2="1080" stroke="#3584e4" stroke-opacity="0.2"/>
    <line x1="960" y1="700" x2="1820" y2="1080" stroke="#3584e4" stroke-opacity="0.2"/>
  </g>

  <!-- Dual Monitor Silhouettes (Background Stage) -->
  <g opacity="0.55" transform="translate(480, 260)">
    <!-- Main Ultrawide Monitor Curved -->
    <rect x="180" y="80" width="600" height="340" rx="16" fill="#111827" stroke="#374151" stroke-width="3"/>
    <!-- Screen Glow with Synthwave / Tech Visualizer -->
    <rect x="195" y="95" width="570" height="310" rx="10" fill="#0b1120"/>
    <path d="M220 340 Q320 280 440 310 T680 250 L740 370 L220 370 Z" fill="#3584e4" fill-opacity="0.25"/>
    <path d="M220 355 Q360 300 500 330 T740 290 L740 370 L220 370 Z" fill="#9333ea" fill-opacity="0.25"/>
    <!-- Stand -->
    <path d="M450 420 L440 490 L520 490 L510 420 Z" fill="#1f2937"/>
    <rect x="400" y="490" width="160" height="14" rx="4" fill="#374151"/>
  </g>

  <!-- Custom High-End Gaming PC Tower (Right Hero Showcase) -->
  <g transform="translate(1180, 240)">
    <!-- Outer Tempered Glass Case -->
    <rect x="0" y="0" width="340" height="520" rx="20" fill="#0f172a" stroke="#334155" stroke-width="4"/>
    <rect x="16" y="16" width="308" height="488" rx="14" fill="#020617" fill-opacity="0.85" stroke="#1e293b" stroke-width="2"/>

    <!-- Front RGB Fans (3x Stack) -->
    <circle cx="65" cy="110" r="42" stroke="url(#rgb-fan)" stroke-width="6" fill="#0f172a" stroke-dasharray="14 8"/>
    <circle cx="65" cy="110" r="16" fill="#38bdf8"/>
    <circle cx="65" cy="240" r="42" stroke="url(#rgb-fan)" stroke-width="6" fill="#0f172a" stroke-dasharray="14 8"/>
    <circle cx="65" cy="240" r="16" fill="#a855f7"/>
    <circle cx="65" cy="370" r="42" stroke="url(#rgb-fan)" stroke-width="6" fill="#0f172a" stroke-dasharray="14 8"/>
    <circle cx="65" cy="370" r="16" fill="#ec4899"/>

    <!-- Motherboard & Internal RGB Loop -->
    <g transform="translate(130, 80)">
      <!-- CPU Liquid Cooler Block with RGB Ring -->
      <circle cx="80" cy="80" r="38" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
      <circle cx="80" cy="80" r="28" fill="#020617"/>
      <path d="M70 70 L90 80 L70 90 Z" fill="#38bdf8"/>
      <!-- Liquid Tubes -->
      <path d="M80 42 C120 10 160 30 170 0" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.8"/>
      <path d="M92 48 C130 20 170 40 180 12" stroke="#a855f7" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.8"/>

      <!-- RAM Sticks (2x RGB Aura) -->
      <rect x="140" y="45" width="10" height="75" rx="3" fill="#38bdf8" filter="drop-shadow(0 0 8px #38bdf8)"/>
      <rect x="156" y="45" width="10" height="75" rx="3" fill="#a855f7" filter="drop-shadow(0 0 8px #a855f7)"/>

      <!-- GPU Giant Graphics Card RTX Style -->
      <rect x="-10" y="190" width="200" height="65" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
      <rect x="0" y="200" width="180" height="10" rx="3" fill="url(#rgb-fan)"/>
      <circle cx="40" cy="225" r="20" stroke="#64748b" stroke-width="3" fill="#0f172a"/>
      <circle cx="100" cy="225" r="20" stroke="#64748b" stroke-width="3" fill="#0f172a"/>
      <circle cx="160" cy="225" r="20" stroke="#64748b" stroke-width="3" fill="#0f172a"/>

      <!-- Power Supply Shroud -->
      <rect x="-114" y="290" width="290" height="110" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
      <text x="-80" y="355" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="3" opacity="0.8">CYBERTECH GOLD 850W</text>
    </g>
  </g>

  <!-- Left Tech Circuit Motif -->
  <g opacity="0.25">
    <path d="M100 200 L250 200 L320 270 L500 270" stroke="#3584e4" stroke-width="3" fill="none"/>
    <circle cx="100" cy="200" r="6" fill="#3584e4"/>
    <circle cx="500" cy="270" r="6" fill="#3584e4"/>
    
    <path d="M150 350 L300 350 L380 430 L600 430" stroke="#9333ea" stroke-width="2.5" fill="none"/>
    <circle cx="150" cy="350" r="5" fill="#9333ea"/>
    <circle cx="600" cy="430" r="5" fill="#9333ea"/>
  </g>
</svg>
