<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#18181b"/>
  <circle cx="400" cy="250" r="230" fill="#3584e4" fill-opacity="0.12" filter="blur(40px)"/>

  <!-- CPU Socket on Left -->
  <rect x="180" y="160" width="160" height="160" rx="16" fill="#202024" stroke="#3584e4" stroke-width="4"/>
  <rect x="210" y="190" width="100" height="100" rx="8" fill="#161618" stroke="#383838" stroke-width="2"/>
  <text x="260" y="245" font-family="system-ui, sans-serif" font-size="16" font-weight="extrabold" fill="#3584e4" text-anchor="middle">CPU</text>
  <text x="260" y="265" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle">100% Optimal</text>

  <!-- Balance Gauge in Center -->
  <circle cx="400" cy="240" r="35" fill="#242428" stroke="#2ec27e" stroke-width="4"/>
  <path d="M388 240 L412 240 M400 228 L400 252" stroke="#2ec27e" stroke-width="3" stroke-linecap="round"/>
  <text x="400" y="300" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2ec27e" text-anchor="middle">BEBAS BOTTLENECK</text>

  <!-- GPU on Right -->
  <rect x="460" y="160" width="160" height="160" rx="16" fill="#202024" stroke="#3584e4" stroke-width="4"/>
  <rect x="490" y="190" width="100" height="100" rx="8" fill="#161618" stroke="#383838" stroke-width="2"/>
  <text x="540" y="245" font-family="system-ui, sans-serif" font-size="16" font-weight="extrabold" fill="#3584e4" text-anchor="middle">GPU</text>
  <text x="540" y="265" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle">100% Utilisasi</text>

  <!-- Connection Bandwidth Pipe -->
  <line x1="340" y1="240" x2="365" y2="240" stroke="#3584e4" stroke-width="4" stroke-dasharray="6 4"/>
  <line x1="435" y1="240" x2="460" y2="240" stroke="#3584e4" stroke-width="4" stroke-dasharray="6 4"/>

  <!-- Title Bottom -->
  <text x="400" y="420" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Panduan Racikan Komponen PC Gaming 2026</text>
  <text x="400" y="445" font-family="system-ui, sans-serif" font-size="13" fill="#a1a1aa" text-anchor="middle">Kombinasi CPU &amp; GPU yang Sempurna untuk Maksimalkan FPS</text>
</svg>
