  </defs>
  <rect width="800" height="500" fill="url(#fintechGrad)" />
  <circle cx="700" cy="80" r="120" fill="#4F46E5" opacity="0.15" />
  <circle cx="100" cy="420" r="160" fill="#0EA5E9" opacity="0.1" />
  
  <!-- Dashboard UI Card -->
  <rect x="100" y="80" width="600" height="340" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2" />
