<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#18181b"/>
  <circle cx="400" cy="240" r="230" fill="#f59e0b" fill-opacity="0.12" filter="blur(40px)"/>

  <!-- Monitor Stand & Screen -->
  <rect x="230" y="90" width="340" height="210" rx="12" fill="#242428" stroke="#383838" stroke-width="4"/>
  <rect x="245" y="105" width="310" height="180" rx="6" fill="#121214"/>
  <!-- Screen UI: POS Software Dashboard -->
  <rect x="260" y="120" width="180" height="24" rx="4" fill="#3584e4"/>
  <text x="270" y="136" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">CYBERPOS v3.2 - KASIR</text>
  <rect x="260" y="152" width="180" height="80" rx="4" fill="#1e1e22"/>
  <rect x="450" y="120" width="90" height="112" rx="4" fill="#242428"/>
  <rect x="458" y="195" width="74" height="28" rx="4" fill="#2ec27e"/>
  <text x="495" y="213" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">BAYAR</text>

  <!-- Monitor Neck & Stand Base -->
  <rect x="385" y="300" width="30" height="50" fill="#303034"/>
  <ellipse cx="400" cy="350" rx="80" ry="14" fill="#242428" stroke="#383838" stroke-width="2"/>

  <!-- Thermal Receipt Printer on Left -->
  <rect x="130" y="270" width="90" height="85" rx="8" fill="#202024" stroke="#383838" stroke-width="2"/>
  <rect x="145" y="282" width="60" height="12" rx="3" fill="#121214"/>
  <path d="M150 282 V260 H200 V282" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  <line x1="155" y1="266" x2="195" y2="266" stroke="#a1a1aa" stroke-width="1.5"/>
  <line x1="155" y1="272" x2="185" y2="272" stroke="#a1a1aa" stroke-width="1.5"/>

  <!-- Barcode Scanner on Right -->
  <path d="M580 320 L610 260 L640 275 L620 335 Z" fill="#27272a" stroke="#383838" stroke-width="2"/>
  <line x1="600" y1="250" x2="570" y2="230" stroke="#e01b24" stroke-width="3" stroke-linecap="round"/>

  <!-- Spec Pills -->
  <rect x="130" y="445" width="160" height="32" rx="16" fill="#242428" stroke="#383838"/>
  <text x="210" y="465" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f59e0b" text-anchor="middle">Intel Core i5 + SSD</text>

  <rect x="310" y="445" width="180" height="32" rx="16" fill="#242428" stroke="#383838"/>
  <text x="400" y="465" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a1a1aa" text-anchor="middle">Thermal Printer + Scanner</text>

  <rect x="510" y="445" width="160" height="32" rx="16" fill="#242428" stroke="#383838"/>
  <text x="590" y="465" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2ec27e" text-anchor="middle">Siap Pakai untuk Toko</text>
</svg>
