<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#18181b"/>
  <circle cx="400" cy="250" r="240" fill="#3584e4" fill-opacity="0.12" filter="blur(40px)"/>

  <!-- Workstation Full Tower -->
  <rect x="250" y="60" width="300" height="370" rx="16" fill="#1e1e22" stroke="#383838" stroke-width="4"/>
  <!-- Brushed Aluminum Front Panel -->
  <rect x="265" y="75" width="70" height="340" rx="8" fill="#141416" stroke="#2e2e34" stroke-width="2"/>
  <!-- Status Lights / Ports -->
  <circle cx="300" cy="110" r="6" fill="#3584e4"/>
  <circle cx="300" cy="130" r="4" fill="#2ec27e"/>
  <rect x="290" y="150" width="20" height="5" rx="2" fill="#383838"/>
  <rect x="290" y="165" width="20" height="5" rx="2" fill="#383838"/>
  <text x="300" y="240" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#52525b" transform="rotate(-90 300 240)">WORKSTATION</text>

  <!-- Side Window with Triple Fan Radiator & Massive GPU -->
  <rect x="350" y="75" width="185" height="340" rx="8" fill="#111113" stroke="#2e2e34" stroke-width="2"/>

  <!-- Liquid Cooler 360mm Radiator Tubes -->
  <path d="M420 120 C 440 160, 410 180, 430 200" stroke="#3584e4" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M435 120 C 455 160, 425 180, 445 200" stroke="#3584e4" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- CPU Block -->
  <rect x="410" y="190" width="50" height="50" rx="8" fill="#27272a" stroke="#3584e4" stroke-width="3"/>
  <circle cx="435" cy="215" r="12" fill="#3584e4" fill-opacity="0.4"/>

  <!-- Massive Quadro / RTX 4080 -->
  <rect x="365" y="270" width="155" height="52" rx="6" fill="#202024" stroke="#484850" stroke-width="2"/>
  <rect x="375" y="280" width="135" height="8" rx="4" fill="#3584e4"/>
  <text x="380" y="308" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#a1a1aa">GEFORCE RTX 4080</text>

  <!-- 4x DDR5 ECC / High Speed RAM -->
  <rect x="475" y="175" width="5" height="40" rx="2" fill="#3584e4"/>
  <rect x="485" y="175" width="5" height="40" rx="2" fill="#3584e4"/>
  <rect x="495" y="175" width="5" height="40" rx="2" fill="#3584e4"/>
  <rect x="505" y="175" width="5" height="40" rx="2" fill="#3584e4"/>

  <!-- Spec Pills -->
  <rect x="140" y="445" width="160" height="32" rx="16" fill="#242428" stroke="#383838"/>
  <text x="220" y="465" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#3584e4" text-anchor="middle">Core i9-14900K</text>

  <rect x="320" y="445" width="160" height="32" rx="16" fill="#242428" stroke="#383838"/>
  <text x="400" y="465" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a1a1aa" text-anchor="middle">64GB DDR5 5600MHz</text>

  <rect x="500" y="445" width="160" height="32" rx="16" fill="#242428" stroke="#383838"/>
  <text x="580" y="465" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2ec27e" text-anchor="middle">2TB Samsung 990 Pro</text>
</svg>
