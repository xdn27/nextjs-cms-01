<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#18181b"/>
  <circle cx="400" cy="240" r="230" fill="#a855f7" fill-opacity="0.14" filter="blur(40px)"/>

  <!-- Laptop Display Lid (Angle) -->
  <polygon points="180,90 620,90 600,280 200,280" fill="#1c1c20" stroke="#383838" stroke-width="3"/>
  <!-- Screen Bezel & Panel -->
  <polygon points="195,100 605,100 590,270 210,270" fill="#09090b"/>
  <!-- Screen Display Art -->
  <polygon points="205,110 595,110 582,260 218,260" fill="#13131a"/>
  <circle cx="400" cy="180" r="45" fill="#e01b24" fill-opacity="0.8"/>
  <path d="M375 160L425 180L375 200Z" fill="#ffffff"/>
  <text x="400" y="240" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#71717a" text-anchor="middle">14" OLED 3K 120Hz 100% DCI-P3</text>

  <!-- Laptop Base Chassis -->
  <polygon points="150,290 650,290 690,390 110,390" fill="#242428" stroke="#383838" stroke-width="3"/>
  <!-- Keyboard Island -->
  <polygon points="200,300 600,300 625,355 175,355" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
  <line x1="220" y1="315" x2="580" y2="315" stroke="#3584e4" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="210" y1="330" x2="590" y2="330" stroke="#a855f7" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="200" y1="345" x2="600" y2="345" stroke="#ec4899" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Trackpad -->
  <polygon points="340,360 460,360 465,385 335,385" fill="#1c1c20" stroke="#3f3f46" stroke-width="1"/>

  <!-- Spec Pills -->
  <rect x="150" y="445" width="150" height="32" rx="16" fill="#242428" stroke="#383838"/>
  <text x="225" y="465" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a855f7" text-anchor="middle">Ryzen 9 8945HS</text>

  <rect x="320" y="445" width="160" height="32" rx="16" fill="#242428" stroke="#383838"/>
  <text x="400" y="465" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#3584e4" text-anchor="middle">RTX 4060 8GB TGP</text>

  <rect x="500" y="445" width="150" height="32" rx="16" fill="#242428" stroke="#383838"/>
  <text x="575" y="465" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2ec27e" text-anchor="middle">Berat Cuma 1.5kg</text>
</svg>
